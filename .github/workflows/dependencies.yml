name: Dependency Update Check

on:
  schedule:
    # Ejecutar todos los lunes a las 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Permitir ejecución manual

jobs:
  update-dependencies:
    name: Check Outdated Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node and Dependencies
        uses: ./.github/actions/setup-node-deps

      - name: Check for outdated packages
        id: outdated
        run: |
          echo "## Outdated Dependencies" >> outdated.md
          echo "" >> outdated.md
          npm outdated >> outdated.md || true
          cat outdated.md >> $GITHUB_STEP_SUMMARY

      - name: Run security audit
        id: audit
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Security Audit" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          npm audit --omit=dev >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          # Check separately for the exit code
          if ! npm audit --omit=dev --audit-level=high > /dev/null 2>&1; then
            echo "has_vulnerabilities=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Issue if vulnerabilities found
        if: steps.audit.outputs.has_vulnerabilities == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🔒 Security: Vulnerabilities detectadas en dependencias';
            const body = `Se han encontrado vulnerabilidades en las dependencias del proyecto.

            Por favor, revisá el [workflow run](${context.payload.repository.html_url}/actions/runs/${context.runId}) para más detalles.

            Ejecutá \`npm audit\` localmente para ver el reporte completo y \`npm audit fix\` para intentar solucionarlas automáticamente.`;

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['security', 'dependencies']
            });
