name: Dependency Update Check

on:
  schedule:
    # Ejecutar todos los lunes a las 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Permitir ejecución manual

jobs:
  update-dependencies:
    name: Check Outdated Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun and Dependencies
        uses: ./.github/actions/setup-bun-deps

      - name: Check for outdated packages
        run: |
          echo "## Outdated Dependencies" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          bun outdated >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      # Security audit dropeado durante migración a Bun.
      # `bun pm scan` requiere configurar un scanner externo en bunfig.toml
      # (sin scanner oficial de Bun aún). Re-habilitar cuando exista alternativa
      # drop-in a `npm audit` o se elija un scanner (ej: socket.dev).
