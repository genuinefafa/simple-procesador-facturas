name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun and Dependencies
        uses: ./.github/actions/setup-bun-deps

      - name: Run Prettier
        run: bun run format:check

      - name: Run ESLint
        run: bun run lint

  typescript:
    name: TypeScript Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun and Dependencies
        uses: ./.github/actions/setup-bun-deps

      - name: Check TypeScript (shared + server + client)
        run: bun run check

  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [quality, typescript]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun and Dependencies
        uses: ./.github/actions/setup-bun-deps

      - name: Build frontend
        run: cd client && bun run build
        env:
          NODE_OPTIONS: '--max-old-space-size=6144'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: client-build
          path: client/build/
          retention-days: 7

  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun and Dependencies
        uses: ./.github/actions/setup-bun-deps

      - name: Run server tests
        run: cd server && bun run test -- --run

      - name: Run client tests
        run: cd client && bun run test:run

      - name: Run server tests with coverage
        run: cd server && bun run test:coverage || echo "Server coverage not configured"
        continue-on-error: true

      - name: Run client tests with coverage
        run: cd client && bun run test:coverage || echo "Client coverage not configured"
        continue-on-error: true

      - name: Upload server coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage-report
          path: server/coverage/
          retention-days: 30
        continue-on-error: true

      - name: Upload client coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-coverage-report
          path: client/coverage/
          retention-days: 30
        continue-on-error: true

  # security:
  #   Job dropeado durante migración a Bun.
  #   `npm audit` requería package-lock.json (eliminado).
  #   `bun pm scan` requiere configurar un scanner externo en bunfig.toml
  #   (no hay scanner oficial de Bun aún). Re-habilitar cuando exista
  #   alternativa drop-in o se elija un scanner (ej: socket.dev).

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [quality, typescript, build, test]
    if: always()

    steps:
      - name: Check all jobs status
        run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality | ${{ needs.quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| TypeScript Validation | ${{ needs.typescript.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Frontend | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests & Coverage | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Fail if critical jobs failed
        if: |
          needs.quality.result == 'failure' ||
          needs.typescript.result == 'failure' ||
          needs.build.result == 'failure'
        run: exit 1

      - name: Warn if non-critical jobs failed
        if: |
          needs.test.result == 'failure'
        run: |
          echo "::warning::Non-critical job failed: test=${{ needs.test.result }}"
