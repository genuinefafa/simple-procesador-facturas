# Ejemplo de referencia. Adaptar a cada deploy.
# Ver README.md para casos concretos (Raspberry Pi, etc.)

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: procesador-facturas
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - procesador-data:/app/data
      - ./google-credentials.json:/app/google-credentials.json:ro
      - ./server/config.json:/app/server/config.json:ro
      - ./server/scripts/seed-data:/app/server/scripts/seed-data:ro
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DB_PATH=/app/data/database.sqlite

volumes:
  procesador-data:
    driver: local
